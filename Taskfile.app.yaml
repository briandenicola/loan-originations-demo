version: "3"

tasks:
  default:
    cmds:
      - task --list

  init:
    desc: Initializes Terraform for app deployment
    cmds:
      - terraform -chdir=./app init

  deploy:
    desc: Builds the ACR image and deploys the Container App
    cmds:
      - task: build
      - task: apply

  build:
    desc: Builds the workflow image in ACR
    cmds:
      - az acr build -r {{.ACR_NAME}}
        -t loan-origination-workflow:{{.COMMIT_VERSION}}
        -t loan-origination-workflow:latest
        -f src/workflow/Dockerfile .
    vars:
      COMMIT_VERSION:
        sh: git rev-parse HEAD | cut -c 1-8
      ACR_NAME:
        sh: terraform -chdir=./infrastructure output -raw ACR_NAME

  apply:
    desc: Applies app Terraform to deploy Container Apps
    cmds:
      - terraform -chdir=./app apply -auto-approve -compact-warnings
        -var "app_name={{.APP_NAME}}"
        -var "region={{.REGION}}"
        -var "tags={{.TAGS}}"
        -var "commit_version={{.COMMIT_VERSION}}"
    vars:
      REGION: '{{default "eastus2" .CLI_ARGS}}'
      TAGS: "Loan Origination"
      COMMIT_VERSION:
        sh: git rev-parse HEAD | cut -c 1-8
      APP_NAME:
        sh: terraform -chdir=./infrastructure output -raw APP_NAME

  destroy:
    desc: Destroys the app deployment
    cmds:
      - terraform -chdir=./app destroy -auto-approve
        -var "app_name={{.APP_NAME}}"
        -var "region={{.REGION}}"
        -var "tags=Loan Origination"
        -var "commit_version=destroy"
    vars:
      REGION: '{{default "eastus2" .CLI_ARGS}}'
      APP_NAME:
        sh: terraform -chdir=./infrastructure output -raw APP_NAME
